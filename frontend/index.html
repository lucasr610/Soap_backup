<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ATI Oracle Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="p-4">
  <div id="root"></div>
  <script type="text/javascript">
    const e = React.createElement;

    function App() {
      const [tab, setTab] = React.useState('queue');
      const [tasks, setTasks] = React.useState([]);
      const [text, setText] = React.useState('');

      const fetchTasks = async () => {
        const resp = await fetch('/tasks');
        const data = await resp.json();
        setTasks(data.tasks);
      };

      React.useEffect(() => { fetchTasks(); }, []);

      const submitTask = async () => {
        await fetch('/submit', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ raw_text: text })
        });
        setText('');
        fetchTasks();
        setTab('queue');
      };

      return e('div', null,
        e('div', {className: 'mb-4'},
          e('button', {className: 'mr-2 px-3 py-1 bg-blue-500 text-white', onClick: () => setTab('queue')}, 'Queue'),
          e('button', {className: 'px-3 py-1 bg-blue-500 text-white', onClick: () => setTab('submit')}, 'Submit')
        ),
        tab === 'queue' && e('ul', {className:'list-disc ml-5'}, tasks.map(t=>e('li', {key:t.name}, `${t.name} - ${t.status}`))),
        tab === 'submit' && e('div', null,
          e('textarea', {className:'w-full border', value:text, onChange:e=>setText(e.target.value)}),
          e('button', {className:'mt-2 px-3 py-1 bg-green-500 text-white', onClick:submitTask}, 'Submit')
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
